name: Verify InfraIntent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint check contracts/infra_intent.py
      - run: genvm-lint schema contracts/infra_intent.py
      - run: python -m pytest tests -q
